# Стратегии zapret-mac. Сторож раз в сутки скачивает этот файл с GitHub (ветка main),
# кнопка «Обновить стратегии» в приложении — сразу. Новая версия принимается, только если
# номер в строке version больше установленного, все строки проходят проверку скрипта
# (strat_parse: знакомые опции, без путей к файлам, @HL в каждом блоке tpws), а tpws
# и utunws принимают каждую стратегию (--dry-run).
#
# Формат: вид|название|параметры
#   tpws — стратегия tpws для YouTube и для своих сайтов; @HL — списки доменов
#   ut   — стратегия utunws для Discord; @F — папка с поддельными пакетами
#   utyt — стратегия utunws для YouTube (одна)
# Подобранные стратегии хранятся в настройках по названию: переименуешь стратегию —
# там, где она была выбрана, подбор начнётся заново.

version|2026102401

tpws|general|@HL --filter-l7=tls --split-pos=1,midsld --disorder --tlsrec=sniext --new @HL --filter-l7=http --hostcase --split-pos=1 --disorder
tpws|ALT|@HL --filter-l7=tls --split-pos=1,midsld --oob --new @HL --filter-l7=http --hostcase --hostdot --split-pos=1 --oob
tpws|ALT2|@HL --filter-l7=tls --split-pos=1,sniext --disorder --tlsrec=sni --new @HL --filter-l7=http --methodeol --hostcase --split-pos=2 --disorder
tpws|MULTI|@HL --filter-l7=tls --split-pos=1,sniext+1,host+1,midsld-2,midsld,midsld+2,endhost-1 --disorder --new @HL --filter-l7=http --split-pos=method+2,midsld --hostcase --disorder
tpws|ALT3|@HL --split-pos=1 --disorder --hostcase
tpws|ALT4|@HL --split-pos=1,midsld --disorder --hostcase
tpws|ALT5|@HL --tlsrec=sniext --split-pos=1 --disorder --hostcase
tpws|ALT6|@HL --tlsrec=sni --split-pos=1,midsld --disorder --hostcase
tpws|ALT7|@HL --oob --split-pos=1,midsld
tpws|ALT8|@HL --oob=tls --disorder=http --split-pos=1,midsld --hostcase
tpws|ALT9|@HL --split-pos=host --disorder --hostcase
tpws|ALT10|@HL --oob --methodeol --split-pos=1,midsld --hostcase --hostdot
tpws|ALT11|@HL --tlsrec=sni --oob --split-pos=1 --hostcase
tpws|ALT12|@HL --split-pos=2 --disorder=tls
tpws|TLSREC|@HL --tlsrec=midsld --split-pos=1,midsld --disorder
tpws|SIMPLE|@HL --split-pos=1

